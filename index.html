<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>RevCord</title>
<style>
:root{--bg:#0b0d12;--p:#11141b;--p2:#171b24;--p3:#1d2330;--text:#f3f5f8;--muted:#9ca5b5;--line:#252b37;--a:#6d5dfc;--good:#39d98a;--bad:#ff5d73}
*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;color:inherit}.hidden{display:none!important}
.app{height:100vh;display:grid;grid-template-columns:72px 235px 1fr 230px}.servers{background:#090b10;border-right:1px solid var(--line);padding:12px 9px;display:flex;flex-direction:column;align-items:center;gap:9px}.server{width:52px;height:52px;border-radius:17px;background:var(--p2);font-weight:800;font-size:18px}.server:hover,.server.active{background:var(--a);border-radius:14px}.server.add{color:var(--good);font-size:27px}.sep{width:32px;height:1px;background:var(--line)}
.side{background:var(--p);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.head{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:800}.head button,.icon{background:transparent;color:var(--muted);width:34px;height:34px;border-radius:9px}.head button:hover,.icon:hover{background:var(--p3);color:var(--text)}.channels{flex:1;overflow:auto;padding:12px}.cat{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:9px 6px 5px}.chan{width:100%;background:transparent;text-align:left;color:var(--muted);padding:9px;border-radius:8px;display:flex;gap:8px}.chan:hover,.chan.active{background:var(--p2);color:var(--text)}.hash{font-size:18px}.profile{border-top:1px solid var(--line);padding:10px;display:flex;align-items:center;gap:8px;background:#0f1218}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6d5dfc,#28aef3);font-weight:800;flex:none}.name{font-weight:750;min-width:0;overflow:hidden;text-overflow:ellipsis}.name small{display:block;color:var(--muted);font-weight:500}.actions{margin-left:auto;display:flex}.actions button{background:transparent;color:var(--muted);width:29px;height:29px;border-radius:7px}.actions button:hover{background:var(--p2);color:var(--text)}
.main{min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}.top b{font-size:15px}.top span{color:var(--muted)}.grow{flex:1}.search{width:180px;height:34px;border:1px solid transparent;border-radius:8px;background:var(--p2);color:var(--text);padding:0 10px;outline:0}.search:focus{border-color:#3d4657}.content{display:flex;flex:1;min-height:0}.chat{display:flex;flex-direction:column;flex:1;min-width:0}.messages{flex:1;overflow:auto;padding:20px}.welcome{border-bottom:1px solid var(--line);padding:12px 0 18px;margin-bottom:10px}.welcome h1{margin:0 0 4px;font-size:25px}.muted{color:var(--muted)}.msg{display:flex;gap:10px;padding:8px 4px;border-radius:8px}.msg:hover{background:#fff1}.msg .av{flex:none}.meta{display:flex;gap:8px;align-items:baseline}.meta time{font-size:10px;color:var(--muted)}.msgtext{margin-top:3px;white-space:pre-wrap;word-break:break-word}.composer{padding:12px 16px 17px}.box{display:flex;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding-left:12px}.box input{flex:1;background:transparent;border:0;outline:0;color:var(--text);height:45px}.box button{background:transparent;color:var(--muted);width:38px}.members{border-left:1px solid var(--line);background:var(--p);padding:16px 12px}.mtitle{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;padding:0 6px 10px}.member{display:flex;gap:9px;align-items:center;padding:8px;border-radius:8px}.member:hover{background:var(--p2)}.online{color:var(--good);font-size:11px}
.back{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:30}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:17px;box-shadow:0 25px 80px #000b}.mh{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}.mh h2{margin:0;font-size:18px}.mb{padding:20px}.field{margin-bottom:15px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;height:42px;background:var(--p2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:0 10px;outline:0}.primary,.secondary{padding:10px 14px;border-radius:8px;font-weight:750}.primary{background:var(--a)}.secondary{background:var(--p3)}.danger{color:var(--bad)}.notice{background:#191d27;border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--muted);font-size:12px;margin-bottom:15px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}.row p{margin:3px 0 0;color:var(--muted);font-size:11px}.toggle{width:45px;height:25px;background:#363d4b;border-radius:20px;padding:3px}.toggle i{display:block;width:19px;height:19px;background:#fff;border-radius:50%;transition:.15s}.toggle.on{background:var(--a)}.toggle.on i{transform:translateX(20px)}.tabs{display:grid;grid-template-columns:145px 1fr;min-height:450px}.tabbar{padding:12px;border-right:1px solid var(--line)}.tab{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);padding:10px;border-radius:7px}.tab.active,.tab:hover{background:var(--p2);color:var(--text)}
.call{width:min(900px,100%);background:#06080c;border-radius:15px;overflow:hidden}.voice-room{padding:20px}.voice-room h3{margin:0 0 6px}.voice-users{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;margin:18px 0}.voice-user{display:flex;align-items:center;gap:9px;padding:10px;background:var(--p2);border:1px solid var(--line);border-radius:10px}.voice-user .state{margin-left:auto;font-size:10px;color:var(--good)}.videos{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;min-height:360px}.vid{position:relative;background:#11151d;border-radius:10px;overflow:hidden;min-height:250px}.vid video{width:100%;height:100%;object-fit:cover;display:block}.label{position:absolute;bottom:8px;left:8px;background:#0009;padding:5px 7px;border-radius:6px;font-size:11px}.controls{display:flex;justify-content:center;gap:10px;padding:15px}.controls button{width:44px;height:44px;border-radius:50%;background:#252b36}.controls .end{background:var(--bad)}.friend{display:flex;align-items:center;gap:10px;background:var(--p2);border-radius:9px;padding:9px;margin:7px 0}.friend .grow{min-width:0}.pill{font-size:10px;color:var(--good)}.empty{text-align:center;color:var(--muted);padding:25px}.compact .msg{padding:3px 4px}.compact .messages{padding-top:12px}.noanim *{transition:none!important;animation:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#171c25;border:1px solid var(--line);padding:12px 14px;border-radius:9px;z-index:100}
@media(max-width:1050px){.app{grid-template-columns:65px 210px 1fr}.members{display:none}}@media(max-width:680px){.app{grid-template-columns:56px 1fr}.side{display:none}.search{display:none}.videos{grid-template-columns:1fr}.tabs{grid-template-columns:1fr}.tabbar{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto}.tab{white-space:nowrap;width:auto}}
</style></head><body><div id="root"></div><div id="modal"></div><div id="toast"></div>
<script>
"use strict";
var KEY="revcord-state-v2";
var base={username:"",activeServer:"home",activeChannel:"general",servers:[{id:"home",name:"Home",icon:"R",channels:[{id:"general",name:"general",type:"text"},{id:"off-topic",name:"off-topic",type:"text"},{id:"lounge",name:"Lounge",type:"voice"}]}],messages:{general:[{id:"welcome",user:"RevCord",text:"Welcome to RevCord. This is a local-only workspace until a backend is added.",time:Date.now()}],"off-topic":[]},friends:[],requests:[],settings:{theme:"dark",compact:false,animations:true,notifications:true,keybinds:true}};
var state=load(), channelBeforeCall=null, bc=null, pc=null, stream=null, peer=null, callToken=null, deafened=false, voiceRoom=null, voicePeers={}, voiceActive=false;var testUser=new URLSearchParams(location.search).get("user");if(testUser&&testUser.trim())state.username=testUser.trim().slice(0,24);
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));return x?Object.assign({},base,x,{settings:Object.assign({},base.settings,x.settings||{})}):JSON.parse(JSON.stringify(base))}catch(e){return JSON.parse(JSON.stringify(base))}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(p){return (p||"id")+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function init(){if(state.username){presence();render()}else{onboard()}}
function presence(){try{bc=new BroadcastChannel("revcord-local");bc.onmessage=signal;bc.postMessage({type:"presence",from:state.username})}catch(e){}}
function server(){return state.servers.filter(function(s){return s.id===state.activeServer})[0]||state.servers[0]}
function chan(){return server().channels.filter(function(c){return c.id===state.activeChannel})[0]||server().channels[0]}
function av(n){return '<div class="avatar">'+esc((n||"?").trim().slice(0,2).toUpperCase())+'</div>'}
function toast(t){document.getElementById("toast").innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(function(){document.getElementById("toast").innerHTML=""},2500)}
function onboard(){document.getElementById("root").innerHTML='<div style="height:100%;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 20%,#252052,#0b0d12 55%)"><form id="join" style="width:min(430px,100%);background:#11141b;border:1px solid #252b37;border-radius:19px;padding:30px;box-shadow:0 25px 80px #000b"><div style="font-size:31px;font-weight:900">RevCord</div><p class="muted">A Discord-style web workspace with no fake users.</p><div class="notice">Your username, messages, servers and friends stay in this browser. Calling works between RevCord tabs/windows using WebRTC; cross-device accounts need a backend.</div><div class="field"><label>USERNAME</label><input id="username" required minlength="2" maxlength="24" autocomplete="off" placeholder="Choose a username"></div><button class="primary" style="width:100%">Enter RevCord</button></form></div>';document.getElementById("join").onsubmit=function(e){e.preventDefault();var n=document.getElementById("username").value.trim();if(n){state.username=n;save();presence();render()}}}
function render(){var s=server(),c=chan(),m=state.messages[c.id]||[];document.documentElement.style.setProperty("--a",state.settings.theme==="midnight"?"#2d9cff":"#6d5dfc");document.body.classList.toggle("compact",!!state.settings.compact);document.body.classList.toggle("noanim",!state.settings.animations);document.getElementById("root").innerHTML='<div class="app"><aside class="servers"><button class="server active">'+esc(s.icon)+'</button><div class="sep"></div>'+state.servers.filter(function(x){return x.id!=="home"}).map(function(x){return '<button class="server '+(x.id===s.id?"active":"")+'" data-server="'+x.id+'">'+esc(x.icon||x.name.slice(0,2))+'</button>'}).join("")+'<button class="server add" id="newServer">+</button></aside><aside class="side"><div class="head"><span>'+esc(s.name)+'</span><button id="serverSettings">⌄</button></div><div class="channels"><div class="cat"><span>Text channels</span><button class="icon" id="newText">+</button></div>'+s.channels.filter(function(x){return x.type==="text"}).map(channelButton).join("")+'<div class="cat"><span>Voice channels</span><button class="icon" id="newVoice">+</button></div>'+s.channels.filter(function(x){return x.type==="voice"}).map(channelButton).join("")+'</div><div class="profile">'+av(state.username)+'<div class="name">'+esc(state.username)+'<small>Local account</small></div><div class="actions"><button id="mute">♩</button><button id="deafen">◉</button><button id="settings">⚙</button></div></div></aside><main class="main"><div class="top"><b># '+esc(c.name)+'</b><span>• local workspace</span><div class="grow"></div><input class="search" id="search" placeholder="Search messages"><button class="icon" id="friends">♙</button><button class="icon" id="call">▣</button></div><div class="content"><section class="chat"><div class="messages" id="messages"><div class="welcome"><h1>Welcome to #'+esc(c.name)+'</h1><div class="muted">Messages are saved locally in this browser.</div></div>'+ (m.length?m.map(msg).join(""):'<div class="empty">No messages yet. Say hello.</div>')+'</div><div class="composer"><div class="box"><input id="compose" placeholder="Message #'+esc(c.name)+'"><button id="emoji">☺</button><button id="send">➤</button></div></div></section><aside class="members"><div class="mtitle">Members • 1</div><div class="member">'+av(state.username)+'<div><b>'+esc(state.username)+'</b><div class="online">● online</div></div></div></aside></div></main></div>';bind()}
function channelButton(x){return '<button class="chan '+(x.id===state.activeChannel?"active":"")+'" data-channel="'+x.id+'"><span class="hash">'+(x.type==="text"?"#":"◖")+'</span><span>'+esc(x.name)+'</span></button>'}
function msg(x){return '<div class="msg"><div class="av">'+av(x.user)+'</div><div><div class="meta"><b>'+esc(x.user)+'</b><time>'+new Date(x.time).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</time></div><div class="msgtext">'+esc(x.text)+'</div></div></div>'}
function bind(){document.querySelectorAll("[data-server]").forEach(function(b){b.onclick=function(){state.activeServer=b.dataset.server;state.activeChannel=server().channels[0].id;save();render()}});document.querySelectorAll("[data-channel]").forEach(function(b){b.onclick=function(){state.activeChannel=b.dataset.channel;save();render();var selected=server().channels.filter(function(x){return x.id===b.dataset.channel})[0];if(selected&&selected.type==="voice")joinVoice(selected.id)}});document.getElementById("newServer").onclick=newServer;document.getElementById("newText").onclick=function(){newChannel("text")};document.getElementById("newVoice").onclick=function(){newChannel("voice")};document.getElementById("serverSettings").onclick=serverSettings;document.getElementById("settings").onclick=settings;document.getElementById("friends").onclick=friends;document.getElementById("call").onclick=function(){startCall("video")};document.getElementById("mute").onclick=mute;document.getElementById("deafen").onclick=deafen;var i=document.getElementById("compose");i.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();send()}};document.getElementById("send").onclick=send;document.getElementById("emoji").onclick=function(){i.value+=" 🙂";i.focus()};document.getElementById("search").oninput=function(){var q=this.value.toLowerCase();document.querySelectorAll(".msg").forEach(function(x){x.style.display=x.innerText.toLowerCase().indexOf(q)>=0?"flex":"none"})}}
function send(){var i=document.getElementById("compose"),t=i.value.trim();if(!t)return;var id=chan().id;if(!state.messages[id])state.messages[id]=[];state.messages[id].push({id:uid("m"),user:state.username,text:t,time:Date.now()});save();i.value="";render();var box=document.getElementById("messages");box.scrollTop=box.scrollHeight}
function closeModal(){document.getElementById("modal").innerHTML=""}
function modal(title,body){document.getElementById("modal").innerHTML='<div class="back" id="back"><div class="modal"><div class="mh"><h2>'+title+'</h2><button class="icon" id="close">✕</button></div>'+body+'</div></div>';document.getElementById("close").onclick=closeModal;document.getElementById("back").onclick=function(e){if(e.target.id==="back")closeModal()}}
function newServer(){var n=prompt("Server name");if(!n||!n.trim())return;var s={id:uid("s"),name:n.trim().slice(0,30),icon:n.trim().slice(0,2).toUpperCase(),channels:[{id:uid("c"),name:"general",type:"text"},{id:uid("v"),name:"Lounge",type:"voice"}]};state.servers.push(s);state.activeServer=s.id;state.activeChannel=s.channels[0].id;state.messages[state.activeChannel]=[];save();render()}
function newChannel(type){var n=prompt(type==="text"?"Text channel name":"Voice channel name");if(!n||!n.trim())return;var id=uid("c");server().channels.push({id:id,name:n.trim().slice(0,30),type:type});state.activeChannel=id;if(type==="text")state.messages[id]=[];save();render()}
function serverSettings(){modal("Server settings",'<div class="mb"><div class="field"><label>SERVER NAME</label><input id="sname" value="'+esc(server().name)+'"></div><button class="primary" id="saveS">Save</button> <button class="secondary danger" id="delS" '+(server().id==="home"?"disabled":"")+'>Delete server</button></div>');document.getElementById("saveS").onclick=function(){var n=document.getElementById("sname").value.trim();if(n)server().name=n;save();closeModal();render()};document.getElementById("delS").onclick=function(){if(server().id!=="home"&&confirm("Delete this local server?")){state.servers=state.servers.filter(function(x){return x.id!==server().id});state.activeServer="home";state.activeChannel="general";save();closeModal();render()}}}
function toggle(k){state.settings[k]=!state.settings[k];save();render();settings()}
function row(k,t,d){return '<div class="row"><div><b>'+t+'</b><p>'+d+'</p></div><button class="toggle '+(state.settings[k]?"on":"")+'" data-toggle="'+k+'"><i></i></button></div>'}
function settings(){modal("User settings",'<div class="tabs"><div class="tabbar"><button class="tab active" data-tab="profile">Profile</button><button class="tab" data-tab="appearance">Appearance</button><button class="tab" data-tab="keybinds">Keybinds</button><button class="tab" data-tab="privacy">Privacy</button></div><div class="mb" id="panel"></div></div>');var panel=document.getElementById("panel");function show(t){document.querySelectorAll("[data-tab]").forEach(function(x){x.classList.toggle("active",x.dataset.tab===t)});var h="";if(t==="profile")h='<h3>My profile</h3><div class="field"><label>DISPLAY NAME</label><input id="display" maxlength="24" value="'+esc(state.username)+'"></div><button class="primary" id="saveP">Save profile</button>';if(t==="appearance")h='<h3>Appearance</h3>'+row("compact","Compact layout","Tighter spacing")+row("animations","Animations","Keep interface transitions enabled")+'<div class="field" style="margin-top:18px"><label>THEME</label><select id="theme"><option value="dark">Dark</option><option value="midnight">Midnight</option></select></div>';if(t==="keybinds")h='<h3>Keybinds</h3><div class="row"><div><b>Quick switcher</b><p>Focus search</p></div><b>Ctrl K</b></div><div class="row"><div><b>Focus composer</b><p>Start typing</p></div><b>Ctrl /</b></div><div class="row"><div><b>Mute microphone</b><p>During a call</p></div><b>M</b></div>'+row("keybinds","Enable keybinds","Keyboard shortcuts control the UI");if(t==="privacy")h='<h3>Privacy & local data</h3><div class="notice">No backend is connected. Nothing in this frontend creates fake users or uploads your local workspace.</div>'+row("notifications","Notifications","Show local in-app notifications")+'<div class="row"><div><b>Reset local data</b><p>Delete this browser workspace</p></div><button class="secondary danger" id="reset">Reset</button></div>';panel.innerHTML=h;document.querySelectorAll("[data-toggle]").forEach(function(b){b.onclick=function(){toggle(b.dataset.toggle)}});if(document.getElementById("theme")){document.getElementById("theme").value=state.settings.theme;document.getElementById("theme").onchange=function(){state.settings.theme=this.value;save();render();settings()}}if(document.getElementById("saveP"))document.getElementById("saveP").onclick=function(){var n=document.getElementById("display").value.trim();if(n){state.username=n;save();closeModal();render()}};if(document.getElementById("reset"))document.getElementById("reset").onclick=function(){if(confirm("Reset all local RevCord data?")){localStorage.removeItem(KEY);location.reload()}}}document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){show(b.dataset.tab)}});show("profile")}
function friends(){modal("Friends",'<div class="mb"><div class="notice">Friends are local-only for now. Open another RevCord tab with a different username to test requests. Cross-device friends need a backend.</div><div style="display:flex;gap:8px"><input id="friendName" style="flex:1;background:var(--p2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:0 10px" placeholder="Username"><button class="primary" id="addFriend">Add</button></div><h3>Friends</h3><div id="flist">'+(state.friends.length?state.friends.map(function(f){return '<div class="friend">'+av(f)+'<div class="grow"><b>'+esc(f)+'</b><div class="pill">local friend</div></div><button class="icon" data-callfriend="'+esc(f)+'">▣</button></div>'}).join(""):'<div class="empty">No friends yet.</div>')+'</div><h3>Requests</h3><div>'+ (state.requests.length?state.requests.map(function(r){return '<div class="friend">'+av(r)+'<div class="grow"><b>'+esc(r)+'</b><div class="muted">Request</div></div><button class="primary" data-accept="'+esc(r)+'">Accept</button></div>'}).join(""):'<div class="empty">No pending requests.</div>')+'</div></div>');document.getElementById("addFriend").onclick=function(){requestFriend(document.getElementById("friendName").value.trim())};document.querySelectorAll("[data-accept]").forEach(function(b){b.onclick=function(){acceptFriend(b.dataset.accept)}});document.querySelectorAll("[data-callfriend]").forEach(function(b){b.onclick=function(){startCall("video",b.dataset.callfriend)}})}
function requestFriend(n){if(!n||n===state.username)return toast("Enter another username");if(state.friends.indexOf(n)>=0)return toast("Already friends");try{bc.postMessage({type:"friend-request",from:state.username,to:n})}catch(e){}toast("Request sent to that username when they are open in another tab")}
function acceptFriend(n){state.requests=state.requests.filter(function(x){return x!==n});if(state.friends.indexOf(n)<0)state.friends.push(n);save();try{bc.postMessage({type:"friend-accepted",from:state.username,to:n})}catch(e){}friends()}
async function startCall(mode,target){if(!navigator.mediaDevices||!window.RTCPeerConnection)return toast("This browser does not support WebRTC calling");if(!target)target=state.friends[0];if(!target)return toast("Add a friend first");if(voiceActive)leaveVoice();peer=target;callToken=uid("call");try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==="video"})}catch(e){peer=null;callToken=null;return toast("Allow camera and microphone access to call")}showCall();pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});stream.getTracks().forEach(function(t){pc.addTrack(t,stream)});pc.onicecandidate=function(e){if(e.candidate)bc.postMessage({type:"offer-ice",from:state.username,to:peer,token:callToken,candidate:e.candidate})};pc.ontrack=function(e){var v=document.getElementById("remote");if(v)v.srcObject=e.streams[0]};pc.onconnectionstatechange=function(){if(pc&&pc.connectionState==="failed")toast("Call failed")};var offer=await pc.createOffer();await pc.setLocalDescription(offer);bc.postMessage({type:"offer",from:state.username,to:peer,token:callToken,offer:offer})}
function showCall(){modal("Video call",'<div class="call"><div class="videos"><div class="vid"><video id="local" autoplay muted playsinline></video><div class="label">You · '+esc(state.username)+'</div></div><div class="vid"><video id="remote" autoplay playsinline></video><div class="label">'+esc(peer)+'</div></div></div><div class="controls"><button id="cm">♩</button><button id="cv">▣</button><button class="end" id="ce">☎</button></div></div>');document.getElementById("local").srcObject=stream;document.getElementById("cm").onclick=mute;document.getElementById("cv").onclick=cam;document.getElementById("ce").onclick=function(){endCall(true)};document.getElementById("close").onclick=function(){endCall(true)}}
async function signal(e){var d=e.data;if(!d||d.from===state.username||d.to&&d.to!==state.username)return;if(d.type==="friend-request"){if(state.requests.indexOf(d.from)<0){state.requests.push(d.from);save();toast("Friend request from "+d.from)}}else if(d.type==="friend-accepted"){if(state.friends.indexOf(d.from)<0)state.friends.push(d.from);save();toast(d.from+" accepted your request")}else if(d.type==="offer"){if(voiceActive)return;peer=d.from;callToken=d.token;try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true})}catch(e){return toast("Incoming call needs camera and microphone permission")}showCall();pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});stream.getTracks().forEach(function(t){pc.addTrack(t,stream)});pc.onicecandidate=function(e){if(e.candidate)bc.postMessage({type:"offer-ice",from:state.username,to:peer,token:callToken,candidate:e.candidate})};pc.ontrack=function(e){var v=document.getElementById("remote");if(v)v.srcObject=e.streams[0]};await pc.setRemoteDescription(d.offer);var a=await pc.createAnswer();await pc.setLocalDescription(a);bc.postMessage({type:"answer",from:state.username,to:peer,token:callToken,answer:a})}else if(d.type==="answer"&&pc&&d.token===callToken){await pc.setRemoteDescription(d.answer)}else if(d.type==="offer-ice"&&pc&&d.token===callToken){try{await pc.addIceCandidate(d.candidate)}catch(e){}}else if(d.type==="end"&&d.token===callToken){endCall(false)}else if(d.type==="voice-join"){if(voiceActive&&d.room===voiceRoom&&d.from!==state.username){if(!voicePeers[d.from])voicePeers[d.from]={};refreshVoiceRoom();createVoiceOffer(d.from)}}else if(d.type==="voice-offer"&&voiceActive&&d.room===voiceRoom){await acceptVoiceOffer(d)}else if(d.type==="voice-answer"&&voiceActive&&d.room===voiceRoom){var p=voicePeers[d.from]&&voicePeers[d.from].pc;if(p)await p.setRemoteDescription(d.answer)}else if(d.type==="voice-ice"&&voiceActive&&d.room===voiceRoom){var q=voicePeers[d.from]&&voicePeers[d.from].pc;if(q)try{await q.addIceCandidate(d.candidate)}catch(e){}}else if(d.type==="voice-leave"&&voiceActive&&d.room===voiceRoom){removeVoicePeer(d.from)}}
function mute(){if(!stream)return toast("You are not in a call");var t=stream.getAudioTracks()[0];if(t)t.enabled=!t.enabled;var b=document.getElementById("cm")||document.getElementById("vmute")||document.getElementById("mute");if(b)b.classList.toggle("danger",t&&!t.enabled)}
function deafen(){if(voiceActive){deafened=!deafened;Object.keys(voicePeers).forEach(function(k){var a=document.getElementById("audio-"+k);if(a)a.muted=deafened});var vb=document.getElementById("vdeafen");if(vb)vb.classList.toggle("danger",deafened);return}var v=document.getElementById("remote");if(!v)return toast("You are not in a call");deafened=!deafened;v.muted=deafened;var b=document.getElementById("deafen");if(b)b.classList.toggle("danger",deafened)}
function cam(){if(!stream)return;var t=stream.getVideoTracks()[0];if(t)t.enabled=!t.enabled}
function endCall(notify){var oldPeer=peer,oldToken=callToken;try{stream&&stream.getTracks().forEach(function(t){t.stop()});pc&&pc.close();if(notify!==false&&bc&&oldPeer)bc.postMessage({type:"end",from:state.username,to:oldPeer,token:oldToken})}catch(e){}stream=null;pc=null;peer=null;callToken=null;closeModal()}
async function joinVoice(room){if(voiceActive)return;if(!navigator.mediaDevices||!window.RTCPeerConnection||!window.BroadcastChannel)return toast("This browser cannot start browser voice chat");voiceRoom=room;voiceActive=true;voicePeers={};try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false})}catch(e){voiceActive=false;voiceRoom=null;return toast("Allow microphone access to join VC")}showVoiceRoom();bc.postMessage({type:"voice-join",from:state.username,room:voiceRoom})}
function showVoiceRoom(){var label=server().channels.filter(function(c){return c.id===voiceRoom})[0]?.name||voiceRoom;modal("Voice channel",'<div class="voice-room"><h3>◖ '+esc(label)+'</h3><div class="muted">Live browser voice chat</div><div class="voice-users" id="voiceUsers"></div><div class="controls"><button id="vmute">♩</button><button id="vdeafen">◉</button><button class="end" id="vleave">☎</button></div></div>');document.getElementById("vleave").onclick=function(){leaveVoice()};document.getElementById("vmute").onclick=mute;document.getElementById("vdeafen").onclick=deafen;document.getElementById("close").onclick=function(){leaveVoice()};refreshVoiceRoom()}
function refreshVoiceRoom(){var box=document.getElementById("voiceUsers");if(!box)return;var names=[state.username].concat(Object.keys(voicePeers));box.innerHTML=names.map(function(n){return '<div class="voice-user">'+av(n)+'<b>'+esc(n)+'</b><span class="state">'+(n===state.username?"You":"Connected")+'</span></div>'}).join("")}
async function createVoiceOffer(name){if(voicePeers[name]&&voicePeers[name].pc)return;var entry=voicePeers[name]||{};var p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});entry.pc=p;voicePeers[name]=entry;stream.getTracks().forEach(function(t){p.addTrack(t,stream)});p.onicecandidate=function(e){if(e.candidate)bc.postMessage({type:"voice-ice",from:state.username,to:name,room:voiceRoom,candidate:e.candidate})};p.ontrack=function(e){attachVoiceAudio(name,e.streams[0])};p.onconnectionstatechange=function(){if(["failed","closed","disconnected"].indexOf(p.connectionState)>=0)removeVoicePeer(name)};var o=await p.createOffer();await p.setLocalDescription(o);bc.postMessage({type:"voice-offer",from:state.username,to:name,room:voiceRoom,answerTo:name,offer:o})}
async function acceptVoiceOffer(d){var entry=voicePeers[d.from]||{};var p=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});entry.pc=p;voicePeers[d.from]=entry;stream.getTracks().forEach(function(t){p.addTrack(t,stream)});p.onicecandidate=function(e){if(e.candidate)bc.postMessage({type:"voice-ice",from:state.username,to:d.from,room:voiceRoom,candidate:e.candidate})};p.ontrack=function(e){attachVoiceAudio(d.from,e.streams[0])};p.onconnectionstatechange=function(){if(["failed","closed","disconnected"].indexOf(p.connectionState)>=0)removeVoicePeer(d.from)};await p.setRemoteDescription(d.offer);var a=await p.createAnswer();await p.setLocalDescription(a);bc.postMessage({type:"voice-answer",from:state.username,to:d.from,room:voiceRoom,answer:a})}
function attachVoiceAudio(name,media){var old=document.getElementById("audio-"+name);if(old)old.remove();var a=document.createElement("audio");a.id="audio-"+name;a.autoplay=true;a.playsInline=true;a.srcObject=media;a.muted=deafened;a.style.display="none";document.body.appendChild(a);a.play().catch(function(){toast("Click the page once if browser audio is blocked")})}
function removeVoicePeer(name){var e=voicePeers[name];if(e&&e.pc)e.pc.close();delete voicePeers[name];var a=document.getElementById("audio-"+name);if(a)a.remove();refreshVoiceRoom()}
function leaveVoice(){if(!voiceActive)return;try{bc.postMessage({type:"voice-leave",from:state.username,room:voiceRoom})}catch(e){}Object.keys(voicePeers).forEach(removeVoicePeer);if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}voiceActive=false;voiceRoom=null;closeModal();render()}
